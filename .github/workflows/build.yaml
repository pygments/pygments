name: Pygments

on:
  push:
    branches: ['*']
    tags: ['*']
  pull_request:

env:
  FORCE_COLOR: 1

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # Run macOS CI only when pushing tags, not on every push/PR.
        # There seems not to be a prettier solution than this trick ...
        exclude:
          - os: ${{ !(github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')) && 'macos-latest' || 'dummy' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip'
    - name: Install tox
      run: pip install -r requirements.txt
    - name: Test package
      run: tox -- -W error

  test-wheel:
    # The wheel ships lexers whose simple rules were merged at build time
    # (see scripts/optimize_lexers.py), so run the tests against it too.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Build the wheel
      run: |
        pip install build
        python -m build --wheel
    - name: Install the wheel and the test dependencies
      run: |
        pip install dist/*.whl "pytest ~= 8.2" pytest-randomly wcag-contrast-ratio
        # Make sure the tests import the installed wheel, not the source tree.
        rm -r pygments
    - name: Check that the installed lexers are optimized
      run: |
        python -c "import pygments.lexers.python as m; assert 'merged(' in open(m.__file__, encoding='utf-8').read()"
    - name: Test the wheel
      run: pytest -W error

  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Install tox
      run: pip install -r requirements.txt
    - name: Perform basic checks
      run: tox -e check
      if: runner.os == 'Linux'

  check-mapfiles:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Install tox
      run: pip install -r requirements.txt
    - name: Regenerate mapfiles
      run: tox -e mapfiles
    - name: Fail if mapfiles changed
      run: |
        if git ls-files -m | grep mapping; then
          echo 'Please run "tox -e mapfiles" and add the changes to a commit.'
          exit 1
        fi

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.x"
    - name: Install tox
      run: pip install -r requirements.txt
    - name: Run regexlint
      run: tox -e regexlint
